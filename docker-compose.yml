version: '3.8'

services:
  hotelmanage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotelmanage
    restart: always
    ports:
      - "80:80"
      - "8081:8081"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/api/auth/login"]
      interval: 30s
      timeout: 5s
      retries: 3
